<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5563">
<title>Morpheus MD</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Morpheus MD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header id="barra">
  <button id="btnAtras" class="icono" aria-label="Atrás" hidden>&#8592;</button>
  <div id="titulo">Morpheus MD</div>
  <button id="btnSOS" class="icono sos" aria-label="Crisis" title="Crisis: algoritmos de emergencia" hidden>SOS</button>
  <button id="btnMenu" class="icono" aria-label="Menú">&#8942;</button>
</header>
<nav id="secciones" hidden></nav>
<main id="vista"></main>
<div id="pie" hidden>
  <span id="estadoGuardado">Guardado</span>
  <button id="btnPdf" class="primario">Ver / PDF</button>
</div>
<div id="capa" hidden></div>
<div id="aviso" hidden></div>
<script src="lib/jspdf.umd.min.js"></script>
<script src="js/imgs.js"></script>
<script src="js/store.js"></script>
<script src="js/cuenta.js"></script>
<script src="js/legal.js"></script>
<script src="js/calc.js"></script>
<script src="js/pistas.js"></script>
<script src="js/obs.js"></script>
<script src="js/pdf.js"></script>
<script src="js/visor.js"></script>
<script src="js/fuentes.js"></script>
<script src="js/extras.js"></script>
<script src="js/guias-datos.js"></script>
<script src="js/bloqueos-datos.js"></script>
<script src="js/crisis.js"></script>
<script src="js/app.js"></script>
<script>
  // Versión web: se instala como app y funciona sin internet (no aplica dentro de la app Android)
  if (!window.Nativo && "serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
    // Si llega una versión nueva, la página se recarga sola una vez para usarla (sin tener que cerrar y abrir)
    const habia = !!navigator.serviceWorker.controller; let recargado = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (habia && !recargado) { recargado = true; location.reload(); } });
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then((r) => r.update()).catch(() => {}));
  }
</script>
</body>
</html>
